[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moonpy"
dynamic = ["version"]
description = "A Lua interpreter written in Python"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "MoonPy", email = "moonpy@example.com"}
]
keywords = ["lua", "interpreter", "scripting", "language"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/yourusername/moonpy"
Documentation = "https://github.com/yourusername/moonpy#readme"
Repository = "https://github.com/yourusername/moonpy"
"Bug Reports" = "https://github.com/yourusername/moonpy/issues"

[project.scripts]
moonpy = "moonpy.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black",
    "flake8",
]

[tool.setuptools]
packages = ["moonpy"]

[tool.setuptools.dynamic]
version = {attr = "moonpy.__version__"}
